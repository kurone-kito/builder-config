name: Publish the packages
run-name: Publish by @${{ github.actor }}
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      next:
        default: true
        description: Publish the alpha version
        type: boolean
permissions:
  contents: write
  id-token: write
  packages: write
jobs:
  build:
    uses: ./.github/workflows/common-release.yml
    with:
      next: ${{ inputs.next || false }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
