name: Publish the packages
run-name: Publish by @${{ github.actor }}
on:
  release:
    types:
      - published
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  packages: write
jobs:
  build:
    uses: ./.github/workflows/common-release.yml
    with:
      next: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
