concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
name: The CI workflow for feature branches and pull requests
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - '**'
      - '!main'
permissions:
  contents: read
run-name: >-
  ${{ github.event_name == 'pull_request' && format('Verified the pull request #{0} by @{1}', github.event.pull_request.number, github.actor) || format('Pushed the feature branch by @{0}', github.actor) }}
jobs:
  build:
    defaults:
      run:
        shell: ${{ matrix.platform.shell }}
    env:
      PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE: 'false'
    name: The build process
    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Stages the pushed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup the pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Prepare the Node.js version ${{ matrix.node-version }} environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          check-latest: true
          node-version: ${{ matrix.node-version }}
      - env:
          HUSKY: 0
        name: Install the dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build the project
        run: pnpm run build
      - name: Check the code style
        run: pnpm run lint
      - name: Run the tests
        run: pnpm run test
    strategy:
      matrix:
        node-version:
          - 22.x
          - 24.x
          - 26.x
        platform:
          - os: ubuntu-latest
            shell: bash
          - os: windows-latest
            shell: bash
          - os: windows-latest
            shell: powershell
      fail-fast: false
    timeout-minutes: 30
