name: IDD doctor health gate
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
on:
  pull_request:
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  idd-doctor:
    name: The idd-doctor health check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Stages the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }} # detached HEAD keeps the worktree check inert
          # Full history and tags: the default fetch-depth: 1 shallow
          # checkout hides tag refs, so idd-doctor's release-tag-drift
          # check (`git describe --tags`) silently skips every run.
          fetch-depth: 0
          persist-credentials: false
      - name: Setup the pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Prepare the Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          check-latest: true
          node-version-file: .node-version
      - name: Install the dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - env:
          GH_TOKEN: ${{ github.token }}
        name: Run idd-doctor
        run: pnpm exec idd-doctor
