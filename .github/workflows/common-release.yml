name: Build and release
on:
  workflow_call:
    inputs:
      next:
        default: false
        description: Publish the alpha version
        type: boolean
    secrets:
      NPM_TOKEN:
        required: true
permissions:
  contents: write
  packages: write
jobs:
  build-and-deploy-to-npmjs:
    env:
      PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE: 'false'
    name: Build and deploy to npmjs.com
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Stages the pushed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup the pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - name: Prepare the Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          check-latest: true
          node-version-file: .node-version
      - name: Install the dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - if: ${{ inputs.next == true }}
        name: Check whether the current version is a prerelease
        run: pnpm run is:prerelease
      - if: ${{ inputs.next != true }}
        name: Check whether the current version is not a prerelease
        run: pnpm run is:release
      - name: Build the project explicitly. The workaround is provisional because the publish command does not perform topological sorting.
        run: pnpm run build
      - env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        name: Setting the npmjs registry and the token
        run: |
          cat << EOF > "${HOME}/.npmrc"
          registry=https://registry.npmjs.org/
          @kurone-kito:registry=https://registry.npmjs.org/
          //registry.npmjs.org/:_authToken=$NPM_TOKEN
          EOF
      - if: ${{ inputs.next != true }}
        name: Publish the packages
        run: pnpm run publish
      - if: ${{ inputs.next == true }}
        name: Publish the packages as the alpha version
        run: pnpm run publish:next
  build-and-deploy-to-github:
    env:
      PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE: 'false'
    name: Build and deploy to GitHub Packages
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Stages the pushed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup the pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - name: Prepare the Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          check-latest: true
          node-version-file: .node-version
      - name: Install the dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - if: ${{ inputs.next == true }}
        name: Check whether the current version is a prerelease
        run: pnpm run is:prerelease
      - if: ${{ inputs.next != true }}
        name: Check whether the current version is not a prerelease
        run: pnpm run is:release
      - name: Build the project explicitly. The workaround is provisional because the publish command does not perform topological sorting.
        run: pnpm run build
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        name: Setting the GitHub registry and the token
        run: |
          cat << EOF > "${HOME}/.npmrc"
          registry=https://npm.pkg.github.com/
          @kurone-kito:registry=https://npm.pkg.github.com/
          //npm.pkg.github.com/:_authToken=$GITHUB_TOKEN
          EOF
      - if: ${{ inputs.next != true }}
        name: Publish the packages
        run: pnpm run publish
      - if: ${{ inputs.next == true }}
        name: Publish the packages as the alpha version
        run: pnpm run publish:next
  build-and-deploy-packages-to-release:
    env:
      PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE: 'false'
    if: ${{ github.event_name == 'release' }}
    name: Build and deploy the packages to the release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Stages the pushed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup the pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - name: Prepare the Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          check-latest: true
          node-version-file: .node-version
      - name: Install the dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - if: ${{ inputs.next == true }}
        name: Check whether the current version is a prerelease
        run: pnpm run is:prerelease
      - if: ${{ inputs.next != true }}
        name: Check whether the current version is not a prerelease
        run: pnpm run is:release
      - name: Build the project explicitly. The workaround is provisional because the publish command does not perform topological sorting.
        run: pnpm run build
      - name: pack the packages
        run: pnpm --filter "!*builder-config" -r pack
      - name: Uploading assets to the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: '*.tgz'
  build-and-deploy-sea-to-release:
    env:
      PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE: 'false'
    if: ${{ github.event_name == 'release' }}
    name: Build and deploy the SEA apps to the release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Stages the pushed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup the pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - name: Prepare the Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          check-latest: true
          node-version-file: .node-version
      - name: Install the dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build the project explicitly. The workaround is provisional because the publish command does not perform topological sorting.
        run: pnpm run build:sea
      - name: Compress the SEA binaries
        run: |
          cd packages/example-cli/sea
          for bin in *; do
            zip -9 "${bin}.zip" "$bin"
          done
      - name: Uploading assets to the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: 'packages/example-cli/sea/*.zip'
