# Intentionally diverged from pnpm-project-template's generic version (#222) -- do not silently overwrite.
name: 🐛 Bug report
description: Create a report to help us improve
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        Before you continue filling out this report, please take a moment to check that your bug has not been [already reported on GitHub](https://github.com/kurone-kito/builder-config/search?q=is%3Aissue&type=issues) 🙌

        🇺🇸🇬🇧 At first, read the following documents:
        https://github.com/kurone-kito/builder-config/blob/main/.github/CONTRIBUTING.md

        🇯🇵 投稿の前に下記のドキュメントを一読ください:
        https://github.com/kurone-kito/builder-config/blob/main/.github/CONTRIBUTING.ja.md

        🇨🇳 首先，阅读以下文档:
        https://github.com/kurone-kito/builder-config/blob/main/.github/CONTRIBUTING.zh.md

        Before submitting logs, screenshots, or other context, please remove any secrets, credentials, tokens, or personal data.

  - type: textarea
    id: overview
    attributes:
      label: Bug Overview
      description: A clear and concise overview of the bug.
      placeholder: When I do "X", "Y" happens instead of "Z".
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Affected package(s)
      description: Which package(s) does this bug affect?
      multiple: true
      options:
        - "@kurone-kito/sea-builder"
        - "@kurone-kito/typescript-config"
        - "@kurone-kito/vite-lib-config"
        - "@kurone-kito/example-cli"
        - "@kurone-kito/example-lib"
        - "Monorepo-wide / tooling (root config, CI, docs)"
        - "Multiple packages / not sure"
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: When I do "X", I expect "Z" to happen.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce the Bug
      description: Detail the series of steps required to reproduce the bug.
      placeholder: When I run "X" using [...], "X" fails with "Y" error message. If I check the terminal outputs and/or logs, I see the following info.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Please provide details about your environment.
      placeholder: |
        - Node.js version: [e.g. 22.23.2/24.2.0/26.0.0/etc...]
        - pnpm version: [e.g. 11.25.0/etc...]
        - OS/architecture: [e.g. Ubuntu 24.04 x64/macOS 15 arm64/Windows 11 x64/etc...]
        - Affected package version or commit hash: [e.g. @kurone-kito/sea-builder@0.22.0/commit hash]
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Suggested verification (optional)
      description: If you already know how a fix could be verified (e.g. a `pnpm test` / `pnpm run build:sea` command, or expected behavior afterward), share it here. Helps a later acceptance-criteria pass.
      placeholder: Run `pnpm run build:sea` and confirm the generated binary starts without the reported error.

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
      placeholder: Feel free to add any other context/information/screenshots/etc... that you think might be relevant to this issue in here.
