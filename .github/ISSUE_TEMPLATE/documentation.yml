# Intentionally diverged from pnpm-project-template's generic version (#222) -- do not silently overwrite.
name: 📚 Documentation
description: Report missing, unclear, or incorrect documentation
labels: documentation
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a documentation issue!

        Before you continue filling out this report, please take a moment to check that it has not been [already reported on GitHub](https://github.com/kurone-kito/builder-config/search?q=is%3Aissue&type=issues) 🙌

        🇺🇸🇬🇧 At first, read the following documents:
        https://github.com/kurone-kito/builder-config/blob/main/.github/CONTRIBUTING.md

        🇯🇵 投稿の前に下記のドキュメントを一読ください:
        https://github.com/kurone-kito/builder-config/blob/main/.github/CONTRIBUTING.ja.md

        🇨🇳 首先，阅读以下文档:
        https://github.com/kurone-kito/builder-config/blob/main/.github/CONTRIBUTING.zh.md

        Before submitting logs, screenshots, or other context, please remove any secrets, credentials, tokens, or personal data.

  - type: textarea
    id: overview
    attributes:
      label: Documentation Issue
      description: What is missing, unclear, or incorrect?
      placeholder: The README says "X", but the actual behavior is "Y".
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Affected package(s)
      description: Which package(s) does this documentation issue concern?
      multiple: true
      options:
        - "@kurone-kito/sea-builder"
        - "@kurone-kito/typescript-config"
        - "@kurone-kito/vite-lib-config"
        - "@kurone-kito/example-cli"
        - "@kurone-kito/example-lib"
        - "Monorepo-wide / tooling (root config, CI, docs)"
        - "Multiple packages / not sure"
    validations:
      required: true

  - type: textarea
    id: document
    attributes:
      label: Affected Document(s)
      description: Which file(s) or section(s) are affected?
      placeholder: "README.md, packages/sea-builder/README.md, docs/idd-workflow.md, etc."
    validations:
      required: true

  - type: textarea
    id: fix
    attributes:
      label: Suggested Fix (optional)
      description: If you already have a suggested rewording or correction, share it here.
      placeholder: Change "X" to "Y" in the "Installation" section.

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about this documentation issue here.
      placeholder: Feel free to add any other context/information/screenshots/etc... that you think might be relevant to this issue here.
