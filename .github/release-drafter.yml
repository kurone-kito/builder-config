name-template: v$RESOLVED_VERSION 🌈
tag-template: v$RESOLVED_VERSION
# Do not use IDD's reserved labels (`roadmap`, `status:blocked-by-human`,
# `status:needs-decision`, `status:authoring`; see docs/idd-policy.md
# § IDD Labels) as a release-drafter category label below — those labels
# mark IDD workflow state, not a PR's actual change type.
categories:
  - title: 🚀 Features
    exclusive: true
    semver-increment: minor
    when:
      labels:
        - enhancement
  - title: 🐛 Bug Fixes
    exclusive: true
    when:
      labels:
        - bug
  - title: 📝 Documentation
    exclusive: true
    when:
      labels:
        - documentation
  - title: 🧰 Maintenance
    collapse-after: 5
    exclusive: true
    when:
      labels:
        - chore
        - dependencies
  - type: version-resolver
    semver-increment: major
    when:
      conventional:
        breaking: true
  - type: version-resolver
    semver-increment: patch
autolabeler:
  - label: enhancement
    title:
      - '/^feat(\(.+\))?!?:/'
  - label: bug
    title:
      - '/^fix(\(.+\))?!?:/'
  - label: documentation
    title:
      - '/^docs(\(.+\))?!?:/'
  - label: chore
    title:
      - '/^(chore|ci|build|refactor|perf|test|revert|style)(\(.+\))?!?:/'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
template: |
  ## Changes

  $CHANGES
