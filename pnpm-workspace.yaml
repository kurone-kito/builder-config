allowBuilds:
  '@kurone-kito/idd-skill@https://codeload.github.com/kurone-kito/idd-skill/tar.gz/f51a8bb73a47452eff5799e8a27251b660ba4ae0': true
  esbuild: true
configDependencies:
  '@pnpm/plugin-types-fixer': 0.1.0+sha512-bLww63gRHi7siYTqFJb5qNdcXadU0jv20Et6z5AryMZ7FlLolbEJOrXLpg8+amQZNHHNW1dfFUBGVw/9ezQbFg==
enableGlobalVirtualStore: true
engineStrict: true
gitChecks: false
ignoreWorkspaceRootCheck: true
linkWorkspacePackages: true
overrides:
  # Pin @types/jsdom's own @types/node dependency: @types/jsdom
  # declares it as an unconstrained '*' dependency (not a peer), so a
  # fresh pnpm resolve can flip which @types/node flavor satisfies it
  # workspace-wide whenever the dependency graph changes elsewhere
  # (e.g. an unrelated devDependency bump) -- silently producing
  # duplicate-identifier TypeScript errors. Matches vite-lib-config's
  # own @types/node range so the pin stays consistent with an
  # existing intentional flavor rather than introducing a third
  # value. Keep in sync with vite-lib-config's own range; revisit
  # once #125 unifies @types/node workspace-wide.
  '@types/jsdom>@types/node': '^24.6.2'
  # Transitive-only pin: xsea's own adm-zip range (^0.5.16) predates the
  # GHSA-xcpc-8h2w-3j85 fix. Drop once xsea widens its own adm-zip
  # dependency to include >=0.6.0.
  adm-zip: '^0.6.0'
  # Transitive-only pin: a fresh resolve of postcss's nanoid: ^3.3.16
  # range still picks the pre-fix 3.3.16 (GHSA-2v37-7h3g-55p8) as of
  # this writing. Drop once a fresh `pnpm install` naturally resolves
  # nanoid >=3.3.17 without this override.
  nanoid: '^3.3.17'
packageExtensions:
  undici-types:
    dependencies:
      '@types/node': ^24.6.2
packages:
  - packages/*
pmOnFail: warn
shellEmulator: true
# Prevent parallel execution of publish. Since no `--workspace-concurrency`
# option exists for pnpm publish, keep this value at 1.
workspaceConcurrency: 1
